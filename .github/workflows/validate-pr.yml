name: "Validate Subdomain PR"

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'domains/**/*.json'

jobs:
  validate:
    name: "Validate Subdomain Configurations"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Required to fetch history for diffing
          fetch-depth: 0 
          # We use the PR merge commit so we can see what the user actually changed
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install glob

      - name: Pre-Validation Label & Maintainer Check
        id: check-bypass
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.issue.number;
            const maintainer = 's8rr';
            const prAuthor = context.payload.pull_request.user.login;
            const execSync = require('child_process').execSync;
            
            try {
              const labels = execSync(`gh pr view ${prNum} --json labels --jq '.labels[].name'`).toString().split('\n');

              if (labels.includes('bypass') || prAuthor.toLowerCase() === maintainer.toLowerCase()) {
                  console.log('✅ Bypass/Maintainer detected. Skipping ownership checks.');
                  process.exit(0);
              }

            } catch (e) {
              console.log('Could not fetch labels or no bypass found, proceeding to full validation.');
            }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Schema and Ownership Validator
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            
            // We need to fetch main so we can compare against it to find what changed
            execSync('git fetch origin main');
            const getFiles = (filter) => {
              try {
                return execSync(`git diff --name-only --diff-filter=${filter} origin/main...HEAD`)
                  .toString().trim().split('\n').filter(Boolean);
              } catch(e) { return []; }
            };

            const changedFiles = getFiles('AM'); // Added or Modified
            const deletedFiles = getFiles('D');  // Deleted

            if (changedFiles.length === 0 && deletedFiles.length === 0) {
              console.log("No domains modified in this PR. Skipping.");
              process.exit(0);
            }

            console.log(`Validating PR by: ${context.payload.pull_request.user.login}`);

            // We pass the labels and author as environment variables to the Node script
            const prLabels = context.payload.pull_request.labels.map(l => l.name);

            try {
                execSync('node scripts/validator.js', { 
                  stdio: 'inherit',
                  env: {
                    ...process.env,
                    PR_AUTHOR: context.payload.pull_request.user.login,
                    PR_LABELS: JSON.stringify(prLabels)
                  }
                });
                console.log("✅ Validation Passed!");
            } catch (error) {
                console.error("❌ Validation Failed. Please check the logs above.");
                process.exit(1);
            }
